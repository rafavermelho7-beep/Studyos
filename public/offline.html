<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Você está offline · StudyOS</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fbfbfa;
        --fg: #17171a;
        --muted: #6b6b6f;
        --accent: #5b5bd6;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b0b0d;
          --fg: #f2f2f3;
          --muted: #9a9aa0;
          --accent: #8181ec;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--fg);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        padding: 24px;
      }
      .card {
        max-width: 360px;
        text-align: center;
      }
      .mark {
        width: 40px;
        height: 40px;
        margin: 0 auto 16px;
        border-radius: 10px;
        background: var(--accent);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 18px;
      }
      h1 {
        font-size: 17px;
        margin: 0 0 8px;
      }
      p {
        color: var(--muted);
        font-size: 14px;
        line-height: 1.5;
        margin: 0 0 20px;
      }
      button {
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 6px;
        padding: 8px 16px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">S</div>
      <h1>Você está offline</h1>
      <p>
        O StudyOS precisa de conexão para carregar seus dados. Assim que a
        internet voltar, tente de novo.
      </p>
      <button onclick="location.reload()">Tentar novamente</button>
    </div>
  </body>
</html>
